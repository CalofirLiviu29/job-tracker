<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#fafaf9;
  --text:#1a1a1a;--text2:#6b7280;--text3:#9ca3af;
  --border:rgba(0,0,0,0.11);--border2:rgba(0,0,0,0.22);
  --radius:8px;--radius-lg:12px;
  --font:'Inter',system-ui,sans-serif;
  --cl:#185fa5;--cl-bg:#e6f1fb;--cl-hover:#cde2f7;
  --cv:#3b6d11;--cv-bg:#eaf3de;--cv-hover:#d2ecb4;
  --app:#6d3eb5;--app-bg:#f0eafd;--app-hover:#e2d5fb;
  --other:#8a5a00;--other-bg:#fdf3e0;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#111;
  --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.20);
}}
body{font-family:var(--font);background:var(--bg3);color:var(--text);min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:2rem 1.5rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
h1{font-size:20px;font-weight:500;display:flex;align-items:center;gap:8px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:.85rem 1rem}
.stat-card .label{font-size:11px;color:var(--text2);margin-bottom:3px}
.stat-card .value{font-size:20px;font-weight:500}
/* tabs */
.tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:1.5rem;overflow-x:auto}
.tab{padding:9px 18px;font-size:13px;background:none;border:none;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.tab:hover:not(.active){color:var(--text)}
.section{display:none}.section.active{display:block}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:none;cursor:pointer;color:var(--text);font-family:var(--font)}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.84}
.btn.danger{color:#a32d2d;border-color:#f7c1c1}
.btn.danger:hover{background:#fcebeb}
.btn-cl{background:var(--cl-bg);color:var(--cl);border-color:var(--cl-bg);font-weight:500}
.btn-cl:hover{background:var(--cl-hover)}
.btn-cv{background:var(--cv-bg);color:var(--cv);border-color:var(--cv-bg);font-weight:500}
.btn-cv:hover{background:var(--cv-hover)}
.btn-app{background:var(--app-bg);color:var(--app);border-color:var(--app-bg);font-weight:500}
.btn-app:hover{background:var(--app-hover)}
.btn-other{background:var(--other-bg);color:var(--other);border-color:var(--other-bg);font-weight:500}
.btn-other:hover{opacity:.85}
/* cards */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:10px}
.card:hover{border-color:var(--border2)}
.job-title{font-size:15px;font-weight:500;margin-bottom:2px}
.job-org{font-size:13px;color:var(--text2)}
.job-meta{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.job-meta span,.job-meta a{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;text-decoration:none}
.job-meta a:hover{color:var(--text)}
/* doc chips on job card */
.job-docs-section{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)}
.job-docs-type-row{margin-bottom:8px}
.job-docs-type-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.doc-chips{display:flex;flex-wrap:wrap;gap:6px}
.doc-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);font-size:12px;cursor:pointer;max-width:240px}
.doc-chip:hover{border-color:var(--border2)}
.doc-chip .ci{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.ci-cl{background:var(--cl-bg);color:var(--cl)}
.ci-cv{background:var(--cv-bg);color:var(--cv)}
.ci-app{background:var(--app-bg);color:var(--app)}
.ci-other{background:var(--other-bg);color:var(--other)}
.doc-chip .chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.doc-add-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.job-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border);flex-wrap:wrap}
/* badges */
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.badge-applied{background:#e6f1fb;color:#185fa5}
.badge-interview{background:#faeeda;color:#854f0b}
.badge-offer{background:#eaf3de;color:#3b6d11}
.badge-rejected{background:#fcebeb;color:#a32d2d}
.badge-wishlist{background:#f1efe8;color:#5f5e5a}
.badge-test{background:#eeedfe;color:#534ab7}
/* filter */
.filter-bar{display:flex;gap:7px;margin-bottom:1.2rem;flex-wrap:wrap}
.filter-chip{padding:5px 11px;font-size:12px;border:0.5px solid var(--border);border-radius:20px;background:none;cursor:pointer;color:var(--text2);font-family:var(--font)}
.filter-chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.sort-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.sort-bar label{font-size:12px;color:var(--text2)}
.sort-bar select{font-size:12px;padding:5px 8px;width:auto;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font)}
/* lib */
.lib-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.lib-title{font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px}
.lib-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lib-controls select{font-size:13px;padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font)}
.topic-group{margin-bottom:1.75rem}
.topic-group-title{font-size:13px;font-weight:600;padding-bottom:8px;border-bottom:0.5px solid var(--border);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.topic-group-title .count{font-weight:400;color:var(--text3);font-size:12px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lib-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:9px}
.lib-card:hover{border-color:var(--border2)}
.lib-card-header{display:flex;align-items:flex-start;gap:9px}
.lib-card-icon{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.lib-card-icon.cl{background:var(--cl-bg);color:var(--cl)}
.lib-card-icon.cv{background:var(--cv-bg);color:var(--cv)}
.lib-card-icon.app{background:var(--app-bg);color:var(--app)}
.lib-card-icon.other{background:var(--other-bg);color:var(--other)}
.lib-card-name{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:1px}
.lib-card-sub{font-size:11px;color:var(--text2)}
.lib-card-desc{font-size:12px;color:var(--text2);line-height:1.55}
.lib-card-tags{display:flex;flex-wrap:wrap;gap:4px}
.lib-card-linked{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.lib-card-footer{display:flex;gap:5px;padding-top:8px;border-top:0.5px solid var(--border);flex-wrap:wrap}
/* tags */
.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag-0{background:#e6f1fb;color:#185fa5}.tag-1{background:#eeedfe;color:#534ab7}
.tag-2{background:#faeeda;color:#854f0b}.tag-3{background:#eaf3de;color:#3b6d11}
.tag-4{background:#f3f0fe;color:#6d4c9e}.tag-5{background:#fce8fb;color:#8b2580}
.tag-6{background:#e0f5f0;color:#1a6650}.tag-7{background:#fdf3e0;color:#8a5a00}
.tag-8{background:#f1efe8;color:#5f5e5a}.tag-9{background:#fcebeb;color:#a32d2d}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.44);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:1.5rem 1rem;overflow-y:auto}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);width:100%;max-width:600px;padding:1.5rem}
.modal.xl{max-width:800px}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1.2rem;display:flex;align-items:center;gap:8px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text)}
.field textarea{resize:vertical;min-height:100px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.2rem;padding-top:1rem;border-top:0.5px solid var(--border)}
/* doc block inside modal */
.doc-block{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:10px;background:var(--bg2)}
.doc-block-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.doc-block-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.doc-block-fields{display:flex;flex-direction:column;gap:10px}
.doc-block.collapsed .doc-block-fields{display:none}
.doc-block-toggle{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;display:flex;align-items:center;gap:4px;font-family:var(--font);padding:0}
.doc-block-toggle:hover{color:var(--text)}
/* drop zone */
.drop-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:.9rem;text-align:center;cursor:pointer;background:var(--bg);position:relative;transition:all .12s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--text)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-row{display:flex;align-items:center;gap:8px;justify-content:center}
.dz-icon{font-size:18px;color:var(--text2)}
.dz-label{font-size:12px;color:var(--text2)}
.dz-sub{font-size:11px;color:var(--text3)}
.upload-status{font-size:11px;padding:4px 8px;border-radius:var(--radius);margin-top:5px;display:none}
.upload-status.ok{background:#eaf3de;color:#3b6d11;display:block}
.upload-status.err{background:#fcebeb;color:#a32d2d;display:block}
.upload-status.loading{background:var(--bg2);color:var(--text2);display:block}
/* topic input */
.topic-wrap{position:relative}
.topic-sug{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);z-index:300;max-height:160px;overflow-y:auto;display:none;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.topic-sug.open{display:block}
.topic-sug-item{padding:7px 12px;font-size:13px;cursor:pointer}
.topic-sug-item:hover{background:var(--bg2)}
.topic-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.topic-chip-wrap{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 4px 2px 7px;border-radius:20px;border:0.5px solid var(--border)}
.topic-chip-wrap button{background:none;border:none;cursor:pointer;color:var(--text3);display:flex;align-items:center;padding:1px;border-radius:50%}
.topic-chip-wrap button:hover{color:var(--text)}
/* cv picker */
.cv-pick-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;margin-top:4px}
.cv-pick-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border:0.5px solid var(--border);border-radius:var(--radius);cursor:pointer}
.cv-pick-item:hover{border-color:var(--border2);background:var(--bg2)}
.cv-pick-item.sel{border-color:var(--cv);background:var(--cv-bg)}
/* empty */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty-state .icon{font-size:36px;margin-bottom:10px;color:var(--border2)}
.empty-state p{font-size:13px;line-height:1.7}
/* section divider */
.modal-divider{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);margin:1.25rem 0 .75rem;padding-top:1rem;border-top:0.5px solid var(--border);display:flex;align-items:center;gap:7px}

/* ── iOS / PWA ── */
:root {
  --sat: env(safe-area-inset-top);
  --sar: env(safe-area-inset-right);
  --sab: env(safe-area-inset-bottom);
  --sal: env(safe-area-inset-left);
}
html { height: -webkit-fill-available; }
body {
  min-height: -webkit-fill-available;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
.pwa-header {
  display: none;
  position: sticky;
  top: 0; left: 0; right: 0;
  z-index: 50;
  background: var(--bg3);
  border-bottom: 0.5px solid var(--border);
  padding: calc(var(--sat) + .6rem) calc(var(--sar) + 1rem) .6rem calc(var(--sal) + 1rem);
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.bottom-tabs {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding-bottom: var(--sab);
  background: var(--bg);
  border-top: 0.5px solid var(--border);
  z-index: 100;
}
.bottom-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 7px 2px 5px;
  font-size: 9px;
  color: var(--text2);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  gap: 2px;
  -webkit-tap-highlight-color: transparent;
}
.bottom-tab i { font-size: 21px; }
.bottom-tab.active { color: var(--cl); }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; margin-left: 4px; vertical-align: middle; flex-shrink: 0;
}
.sync-dot.ok { background: #3b6d11; }
.sync-dot.syncing { background: #854f0b; animation: pulse .8s infinite alternate; }
.sync-dot.err { background: #a32d2d; }
@keyframes pulse { from { opacity:1 } to { opacity:.3 } }
.sync-bar {
  font-size: 11px; color: var(--text2);
  padding: 5px 1.5rem;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 0.5px solid var(--border);
  background: var(--bg3);
}
/* Setup modal overlay */
.setup-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 500; padding: 1.5rem;
}
.setup-box {
  background: var(--bg); border-radius: var(--radius-lg);
  padding: 1.75rem; width: 100%; max-width: 440px;
  border: 0.5px solid var(--border);
}
.setup-box h2 { font-size: 16px; font-weight: 600; margin-bottom: .5rem; display:flex;align-items:center;gap:8px }
.setup-box p { font-size: 13px; color: var(--text2); margin-bottom: 1.25rem; line-height: 1.6 }
.setup-box input {
  width: 100%; padding: 9px 11px; font-size: 13px;
  border: 0.5px solid var(--border2); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-family: var(--font);
  outline: none; margin-bottom: 10px;
}
.setup-box input:focus { border-color: var(--text); }
.setup-box .hint { font-size: 11px; color: var(--text3); margin-bottom: 1rem; line-height: 1.5 }
@media (max-width: 640px) {
  .pwa-header { display: flex; }
  .bottom-tabs { display: flex; }
  .top-bar { display: none; }
  .tabs { display: none; }
  .app { padding: 0; max-width: 100%; }
  .scroll-area {
    padding: .75rem calc(var(--sar) + .9rem) calc(var(--sab) + 72px) calc(var(--sal) + .9rem);
  }
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal {
    border-radius: 20px 20px 0 0;
    max-width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal.xl { max-width: 100%; }
  .btn { min-height: 38px; }
  .filter-chip { min-height: 34px; }
  .lib-grid { grid-template-columns: 1fr; }
}
@media (min-width: 641px) {
  .pwa-header { display: none !important; }
  .bottom-tabs { display: none !important; }
  .scroll-area { padding: 2rem 1.5rem; }
}


.rem{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;font-weight:500;margin-top:8px}
.rem.red{background:#fcebeb;color:#a32d2d}.rem.amber{background:#faeeda;color:#854f0b}.rem.grey{background:var(--bg2);color:var(--text2)}
.ic{padding:2px 5px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:14px}.ic:hover{color:var(--text)}
.ic.del:hover{color:#a32d2d}
@media(max-width:640px){input,select,textarea{font-size:16px!important}}
html,body{max-width:100%;overflow-x:hidden}
</style></head><body>
<div class="setup-overlay" id="setup" style="display:none"><div class="setup-box"><h2><i class="ti ti-lock"></i> Accedi</h2>
<p>Email e password dell'utente creato in Supabase. Sul telefono Safari può salvarle nel portachiavi.</p>
<input id="lg-em" type="email" placeholder="email" autocomplete="username"><input id="lg-pw" type="password" placeholder="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="$('setup').style.display='none'">Salta (solo locale)</button><button class="btn primary" id="lg-btn" onclick="login()">Accedi</button></div></div></div>
<div class="pwa-header"><h1 style="font-size:17px;font-weight:600"><i class="ti ti-briefcase"></i> Job Tracker</h1>
<div style="display:flex;gap:6px;align-items:center"><span class="sync-dot ok" id="sd1"></span><button class="btn primary" onclick="jobModal()"><i class="ti ti-plus"></i> New</button><button class="btn" onclick="pull()"><i class="ti ti-refresh"></i> Sync</button></div></div>
<div class="sync-bar"><span class="sync-dot ok" id="sd2"></span><span id="sl">Avvio…</span><span style="flex:1"></span>
<button class="btn" style="font-size:11px;padding:3px 8px" onclick="pull()"><i class="ti ti-refresh"></i> Sync</button>
<button class="btn" style="font-size:11px;padding:3px 8px" onclick="settings()"><i class="ti ti-settings"></i> Impostazioni</button></div>
<div class="bottom-tabs"><button class="bottom-tab active" data-tab="pipeline" onclick="tab('pipeline')"><i class="ti ti-layout-list"></i>Pipeline</button><button class="bottom-tab" data-tab="docs" onclick="tab('docs')"><i class="ti ti-files"></i>Documenti</button><button class="bottom-tab" data-tab="trash" onclick="tab('trash')"><i class="ti ti-trash"></i>Cestino</button></div>
<div class="app"><div class="scroll-area">
<div class="top-bar"><h1><i class="ti ti-briefcase"></i> Job tracker</h1><div style="display:flex;gap:8px"><button class="btn primary" onclick="jobModal()"><i class="ti ti-plus"></i> New application</button><button class="btn" onclick="exportData()"><i class="ti ti-download"></i> Export</button><label class="btn" style="cursor:pointer"><i class="ti ti-upload"></i> Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label></div></div>

async function auth(g,b){const r=await fetch(SU+'/auth/v1/token?grant_type='+g,{method:'POST',headers:{apikey:AK,'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'HTTP '+r.status);return j}

function vdoc(jid){const j=state.jobs.find(x=>x.id===jid);return j?{id:'vac_'+jid,type:'OTHER',name:j.title+' - '+(j.vacancy?'Vacancy notice':'Descrizione offerta'),category:'',description:'',topics:[],file:j.vacancy||null,content:j.jobDesc||'',linkedJobs:[jid]}:undefined}
function vacRow(j){const c=(l,ic)=>`<div class="doc-chip" onclick="viewDoc('vac_${j.id}')"><div class="ci ci-other"><i class="ti ti-${ic}"></i></div><span class="chip-name">${l}</span></div>`;
return`<div class="job-docs-type-row" style="margin-top:10px"><div class="job-docs-type-label" style="color:var(--other)"><i class="ti ti-clipboard-text"></i>Vacancy</div><div class="doc-chips">${j.vacancy?c('Vacancy notice ('+esc(j.vacancy.name)+')','file-text'):`<button class="btn btn-other" onclick="vacPick('${j.id}')"><i class="ti ti-plus"></i> Vacancy notice</button>`}${j.jobDesc?c('Descrizione offerta','align-left'):`<button class="btn btn-other" onclick="descModal('${j.id}')"><i class="ti ti-plus"></i> Descrizione</button>`}</div></div>`}
function vacPick(jid){vacId=jid;$('vrep').click()}
async function vacPicked(i){const f=i.files[0];i.value='';if(!f||!vacId)return;const j=state.jobs.find(x=>x.id===vacId);try{const nf=await up(j.id,f),old=j.vacancy;j.vacancy=nf;save();render();if(old)rm(old.path)}catch(e){alert('Upload non riuscito: '+e.message)}}
async function rmVac(jid){const j=state.jobs.find(x=>x.id===jid);if(!j.vacancy||!confirm('Rimuovere la vacancy notice?'))return;await rm(j.vacancy.path);j.vacancy=null;save();render();closeModal()}
function descModal(jid){const j=state.jobs.find(x=>x.id===jid);show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-align-left"></i> Descrizione offerta</h2><div class="field"><textarea id="dsc" style="min-height:220px" placeholder="Incolla qui il testo dell'annuncio (es. da LinkedIn)">${esc(j.jobDesc)}</textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveDesc('${jid}')">Salva</button></div></div></div>`)}
function saveDesc(jid){const j=state.jobs.find(x=>x.id===jid);j.jobDesc=$('dsc').value.trim();save();render();closeModal()}
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function days(s){if(!s)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+'T00:00:00')-t)/864e5)}
// ---- state ----
function norm(){state.jobs=(state.jobs||[]).map(j=>{const o=(j.status==='Interview'||j.status==='Test/Assessment')?Object.assign({},j,{stage:j.status,status:'Shortlisted'}):Object.assign({},j);if(!o.contacts)o.contacts=o.contactEmail?[{name:'',role:'',email:o.contactEmail,phone:''}]:[];return o});state.del=state.del||{};state.docs=(state.docs||[]).map(d=>{const o=Object.assign({topics:[],description:'',file:null},d,{linkedJobs:d.linkedJobs||(d.linkedJob?[d.linkedJob]:[]),type:['CL','CV','APP','OTHER'].includes(d.type)?d.type:'CL'});delete o.linkedJob;return o});state.jobs.forEach(r=>{if(!r.u)r.u=state.updatedAt||1});state.docs.forEach(r=>{if(!r.u)r.u=state.updatedAt||1})}
function load(){try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s)state=Object.assign(state,s)}catch(e){}norm();localStorage.removeItem('gh_token_jt');localStorage.removeItem('supa_key_jt');initSnap()}
function persist(){try{localStorage.setItem(SK,JSON.stringify(state))}catch(e){}}
function initSnap(){snap={};[...state.jobs,...state.docs].forEach(r=>{snap[r.id]=JSON.stringify(Object.assign({},r,{u:0}))})}
function stamp(now){state.del=state.del||{};const cur={};[...state.jobs,...state.docs].forEach(r=>{const k=JSON.stringify(Object.assign({},r,{u:0}));cur[r.id]=k;if(snap[r.id]!==k)r.u=now});Object.keys(snap).forEach(id=>{if(!(id in cur))state.del[id]=now});Object.keys(state.del).forEach(k=>{if(now-state.del[k]>7776e6)delete state.del[k]});snap=cur}
const sig=x=>JSON.stringify([...(x.jobs||[]),...(x.docs||[])].map(r=>[r.id,r.u||0]).sort())+JSON.stringify(Object.keys(x.del||{}).sort().map(k=>[k,x.del[k]]));
function mergeList(L,R,del){const m=new Map();R.forEach(r=>m.set(r.id,r));L.forEach(r=>{const o=m.get(r.id);if(!o||(r.u||0)>=(o.u||0))m.set(r.id,r)});return[...m.values()].filter(r=>!(del[r.id]&&del[r.id]>(r.u||0)))}
function merge(rd){const del=Object.assign({},rd.del||{}),sd=state.del||{};Object.keys(sd).forEach(k=>{del[k]=Math.max(del[k]||0,sd[k])});state.jobs=mergeList(state.jobs,rd.jobs||[],del);state.docs=mergeList(state.docs,rd.docs||[],del);state.del=del;norm()}
function save(){mods++;const now=Date.now();stamp(now);state.updatedAt=now;dirty=true;persist();clearTimeout(pt);pt=setTimeout(()=>pull(true),1500)}
// ---- sync (Supabase) ----
function ss(c,m){['sd1','sd2'].forEach(i=>{if($(i))$(i).className='sync-dot '+c});$('sl').textContent=m}
async function pull(q){const m0=mods;if(!signedIn())return ss('err','Non connesso: fai il login');if(!q)ss('syncing','Sincronizzazione...');
try{const r=await fetch(SU+'/rest/v1/app_state?id=eq.main&select=data',{headers:await H()});
if(r.status==401||r.status==403)return ss('err','Accesso negato: esci e rifai il login');
if(r.status==404)return ss('err','Tabella app_state mancante: esegui lo SQL');
if(!r.ok)throw new Error('HTTP '+r.status);
const rows=await r.json(),rd=rows[0]&&rows[0].data;
if(!rd){await push();return}
merge(rd);
if(sig(state)!==sig(rd)){state.updatedAt=Date.now();persist();await push()}else{state.updatedAt=rd.updatedAt||state.updatedAt;persist();if(mods===m0)dirty=false}
initSnap();render();purgeOld();
ss('ok','Sincronizzato '+new Date().toLocaleTimeString())}catch(e){ss('err','Errore: '+e.message)}}
async function push(){if(!signedIn())return;const at=state.updatedAt;ss('syncing','Salvataggio...');
try{const r=await fetch(SU+'/rest/v1/app_state?on_conflict=id',{method:'POST',headers:await H({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:'main',data:state})});
if(!r.ok)throw new Error('HTTP '+r.status);if(state.updatedAt===at)dirty=false;ss('ok','Salvato '+new Date().toLocaleTimeString())}catch(e){ss('err','Errore: '+e.message)}}
function settings(){show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-settings"></i> Account e dati</h2><p style="font-size:13px;color:var(--text2);margin-bottom:1rem">${signedIn()?'Connesso come <b>'+esc(sess.email)+'</b>':'Non connesso'}</p>
<div style="display:flex;flex-direction:column;gap:8px"><button class="btn" onclick="closeModal();statsModal()"><i class="ti ti-chart-bar"></i> Statistiche</button><button class="btn" onclick="closeModal();backupZip()"><i class="ti ti-download"></i> Backup completo (ZIP con tutti i file)</button><button class="btn" onclick="closeModal();exportData()"><i class="ti ti-file-export"></i> Esporta solo i dati (JSON)</button><label class="btn" style="cursor:pointer"><i class="ti ti-file-import"></i> Importa dati (JSON)<input type="file" accept=".json" onchange="importData(event);closeModal()" style="display:none"></label></div>
<div class="modal-actions"><button class="btn" onclick="closeModal()">Chiudi</button>${signedIn()?'<button class="btn danger" onclick="logout()">Esci</button>':''}</div></div></div>`)}
// ---- files (Supabase Storage) ----
async function up(id,f){if(f.size>25*1048576)throw new Error('File oltre 25 MB');
const path=id+'/'+Date.now()+'_'+f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.-]+/g,'_').slice(-80),mime=f.type||mimeOf(f.name);
const fd=new FormData();fd.append('cacheControl','3600');fd.append('',new File([f],f.name,{type:mime}));
const r=await fetch(SU+'/storage/v1/object/'+BK+'/'+path,{method:'POST',headers:Object.assign(await H(),{'x-upsert':'true'}),body:fd});
if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(m||'HTTP '+r.status)}
return{path,name:f.name,mime,size:f.size}}
async function rm(p){try{await fetch(SU+'/storage/v1/object/'+BK,{method:'DELETE',headers:await H({'Content-Type':'application/json'}),body:JSON.stringify({prefixes:[p]})})}catch(e){}}
async function blob(d){const r=await fetch(SU+'/storage/v1/object/'+BK+'/'+d.file.path,{headers:await H()});if(!r.ok)throw new Error('HTTP '+r.status);return new Blob([await r.blob()],{type:d.file.mime||mimeOf(d.file.name)})}
async function dl(id){const d=doc(id);try{const b=await blob(d),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){alert('Download non riuscito: '+e.message)}}
function pick(id){repId=id;$('rep').click()}
async function repPicked(i){const f=i.files[0];i.value='';if(!f||!repId)return;const d=doc(repId);try{const nf=await up(d.id,f),old=d.file;if(!d.name||(old&&d.name===old.name.replace(/\.[^.]+$/,'')))d.name=f.name.replace(/\.[^.]+$/,'');d.file=nf;save();render();if(old)rm(old.path)}catch(e){alert('Upload non riuscito: '+e.message)}}
function delDoc(id){const d=doc(id);if(!d)return Promise.resolve();const n=d.linkedJobs.length;if(!confirm('Spostare "'+d.name+'" nel cestino'+(n>1?' (è usato in '+n+' application)':'')+'? Potrai ripristinarlo per 30 giorni.'))return Promise.resolve();d.trashed=Date.now();save();render();return Promise.resolve()}
async function viewDoc(id){const d=doc(id);if(!d)return;
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal xl"><h2><i class="ti ti-${TI[d.type]}" style="color:${TC[d.type]}"></i> ${esc(d.name)}</h2>
<div style="font-size:12px;color:var(--text2);margin-bottom:8px">${d.cvFormat?'<span class="tag tag-8">'+esc(d.cvFormat)+'</span> ':''}${esc(d.category||'')} ${(d.topics||[]).map(t=>'<span class="tag '+tc(t)+'">'+esc(t)+'</span>').join(' ')} ${esc(d.description)}</div>
<div id="vb" style="max-height:68vh;overflow:auto;border:0.5px solid var(--border);border-radius:var(--radius);padding:.75rem;font-size:13px;line-height:1.6;background:var(--bg2)">Caricamento...</div>
<div class="modal-actions">${d.file?`<button class="btn" onclick="dl('${d.id}')"><i class="ti ti-download"></i> Scarica</button>`:''}${String(d.id).startsWith('vac_')?`<button class="btn" onclick="closeModal();vacPick('${String(d.id).slice(4)}')"><i class="ti ti-upload"></i> ${d.file?'Sostituisci file':'Carica vacancy notice'}</button>${d.file?`<button class="btn danger" onclick="rmVac('${String(d.id).slice(4)}')"><i class="ti ti-trash"></i> Rimuovi file</button>`:''}<button class="btn" onclick="closeModal();descModal('${String(d.id).slice(4)}')"><i class="ti ti-align-left"></i> Descrizione</button>`:`<button class="btn" onclick="closeModal();docModal('${d.type}',null,'${d.id}')"><i class="ti ti-edit"></i> Edit</button>`}${String(d.id).startsWith('vac_')?'':`<button class="btn danger" onclick="delDoc('${d.id}').then(()=>{if(!doc('${d.id}')||doc('${d.id}').trashed)closeModal()})"><i class="ti ti-trash"></i> Cancella</button>`}<button class="btn primary" onclick="closeModal()">Chiudi</button></div></div></div>`);
const v=$('vb');if(!d.file){v.style.whiteSpace='pre-wrap';v.textContent=d.content||'Nessun file caricato. Usa Edit per caricarlo.';return}
try{const b=await blob(d),n=d.file.name.toLowerCase();
if(n.endsWith('.pdf')){const u=URL.createObjectURL(b);urls.push(u);v.style.padding='0';v.innerHTML=`<iframe src="${u}" style="width:100%;height:66vh;border:0"></iframe>`}
else if(n.endsWith('.docx')){let ok=false;if(window.docx&&window.JSZip){try{v.innerHTML='';v.style.padding='0';v.style.background='#d9d9d9';v.style.color='#111';await docx.renderAsync(b,v,null,{inWrapper:true,breakPages:true,ignoreLastRenderedPageBreak:true,useBase64URL:true});ok=true}catch(e){}}if(!ok){const r=await mammoth.convertToHtml({arrayBuffer:await b.arrayBuffer()});v.style.padding='.75rem';v.style.background='#fff';v.style.color='#111';v.innerHTML=r.value}}
else if(/\.(jpe?g|png)$/.test(n)){const u=URL.createObjectURL(b);urls.push(u);v.innerHTML=`<img src="${u}" style="max-width:100%">`}
else v.textContent='Anteprima non disponibile per questo formato. Usa Scarica.'}catch(e){v.textContent='Errore: '+e.message}if(d.file&&d.content&&String(d.id).startsWith('vac_'))v.insertAdjacentHTML('beforeend','<div style="white-space:pre-wrap;margin-top:12px;border-top:0.5px solid #999;padding:10px;background:var(--bg);color:var(--text)">'+esc(d.content)+'</div>')}
// ---- topics ----
function tc(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))&65535;return 'tag-'+h%10}
function tchips(k){return(tops[k]||[]).map(t=>`<span class="topic-chip-wrap"><span class="tag ${tc(t)}">${esc(t)}</span><button data-t="${esc(t)}" onclick="trem('${k}',this.dataset.t)"><i class="ti ti-x" style="font-size:11px"></i></button></span>`).join('')}

<div class="field-row"><div class="field"><label>Location</label><input id="j-loc" value="${esc(j.location)}"></div><div class="field"><label>Status</label><select id="j-st" onchange="$('j-stg').style.display=this.value==='Shortlisted'?'':'none'">${STAT.map(x=>`<option${x===j.status?' selected':''}>${x}</option>`).join('')}</select><select id="j-stg" style="margin-top:6px;display:${j.status==='Shortlisted'?'':'none'}">${STAGES.map(g=>`<option${g===j.stage?' selected':''}>${g}</option>`).join('')}</select></div></div>
<div class="field-row"><div class="field"><label>Date applied</label><input type="date" id="j-date" value="${j.date||''}"></div><div class="field"><label>Deadline</label><input type="date" id="j-dl" value="${j.deadline||''}"></div></div>
<div class="field"><label>Job post URL</label><input id="j-url" value="${esc(j.url)}"></div>
<div class="field"><label>Vacancy notice (PDF o Word, es. avviso della Commissione europea)${j.vacancy?' - attuale: '+esc(j.vacancy.name):''}</label><input type="file" accept=".pdf,.doc,.docx" onchange="pend.v=this.files[0]">${j.vacancy?'<label style="display:flex;gap:8px;align-items:center;font-size:12px;margin-top:6px"><input type="checkbox" id="j-vrm" style="width:auto"> Rimuovi la vacancy notice attuale</label>':''}</div>
<div class="field"><label>Descrizione offerta (testo libero, es. incollato da LinkedIn)</label><textarea id="j-desc" style="min-height:90px">${esc(j.jobDesc)}</textarea></div>
<div class="modal-divider"><i class="ti ti-address-book"></i> Contatto recruiter</div>
<div class="field-row"><div class="field"><label>Data ultimo contatto</label><input type="date" id="j-lc" value="${j.lastContact||''}"></div><div class="field"><label>Prossimo follow-up</label><input type="date" id="j-fu" value="${j.followUpDate||''}"></div></div>
<div class="field"><label>Contatti (recruiter, hiring manager...)</label><div id="cts">${(j.contacts&&j.contacts.length?j.contacts:[{}]).map(ctRow).join('')}</div><button type="button" class="btn" onclick="addCt()"><i class="ti ti-plus"></i> Aggiungi contatto</button></div>
<div class="modal-divider"><i class="ti ti-calendar-event"></i> Colloquio</div>
<div class="field-row"><div class="field"><label>Data e ora</label><input type="datetime-local" id="j-iv" value="${esc(j.interviewAt)}"></div><div class="field"><label>Luogo o link</label><input id="j-ivp" value="${esc(j.interviewPlace)}" placeholder="Sede, Teams, Zoom..."></div></div>
<div class="field"><label>Notes</label><textarea id="j-notes" style="min-height:60px">${esc(j.notes)}</textarea></div>
${id?'<div class="modal-divider"><i class="ti ti-files"></i> Allegati di questa application (sola visualizzazione)</div><div id="jdocs"></div>':''}<div class="modal-divider"><i class="ti ti-paperclip"></i> Aggiungi nuovi documenti</div>
<div id="blks"></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-cl" onclick="addBlk('CL')"><i class="ti ti-plus"></i> Cover letter</button><button class="btn btn-cv" onclick="addBlk('CV')"><i class="ti ti-plus"></i> CV</button><button class="btn btn-app" onclick="addBlk('APP')"><i class="ti ti-plus"></i> App form</button><button class="btn btn-other" onclick="addBlk('OTHER')"><i class="ti ti-plus"></i> Supporting documents</button></div>
<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sv" onclick="saveJob()">Save</button></div></div></div>`);jd()}
async function saveJob(){const title=$('j-title').value.trim(),org=$('j-org').value.trim();if(!title||!org)return alert('Titolo e organizzazione sono obbligatori');
const old=state.jobs.find(x=>x.id===eid),j=Object.assign({},old,{id:eid||uid(),title,org,location:$('j-loc').value.trim(),status:$('j-st').value,stage:$('j-st').value==='Shortlisted'?$('j-stg').value:'',date:$('j-date').value,deadline:$('j-dl').value,url:$('j-url').value.trim(),notes:$('j-notes').value.trim(),lastContact:$('j-lc').value,followUpDate:$('j-fu').value,contacts:getCts(),interviewAt:$('j-iv').value,interviewPlace:$('j-ivp').value.trim(),jobDesc:$('j-desc').value.trim()});
if(!old&&liveJ().some(x=>x.title.trim().toLowerCase()===title.toLowerCase()&&x.org.trim().toLowerCase()===org.toLowerCase())&&!confirm('Esiste già una application con questo ruolo e questa istituzione. Aggiungerla comunque?'))return;
histPush(old,j);
if(old)state.jobs[state.jobs.indexOf(old)]=j;else state.jobs.unshift(j);
$('sv').disabled=true;$('sv').textContent='Caricamento...';const errs=[];
if(old&&old.vacancy&&$('j-vrm')&&$('j-vrm').checked){await rm(old.vacancy.path);j.vacancy=null}
if(pend.v){try{const nf=await up(j.id,pend.v),prev=j.vacancy;j.vacancy=nf;if(prev)rm(prev.path)}catch(e){errs.push('Vacancy notice: '+e.message)}}
for(const el of document.querySelectorAll('.doc-block')){const b=el.dataset.b,t=el.dataset.t;if(t!=='OTHER')tadd(b);const f=pend[b],name=$('bn-'+b).value.trim()||(f&&f.name.replace(/\.[^.]+$/,''));if(!name)continue;
const d={id:uid(),type:t,name,description:'',topics:t==='OTHER'?[]:[...(tops[b]||[])],category:t==='OTHER'?$('bc-'+b).value.trim():undefined,linkedJobs:[j.id],cvFormat:t==='CV'?$('bfm-'+b).value:undefined,date:today(),file:null};
if(f)try{d.file=await up(d.id,f)}catch(e){errs.push(name+': '+e.message)}state.docs.unshift(d)}
save();closeModal();render();if(errs.length)alert('Documenti creati ma file non caricati (riprova con "Sostituisci file"):\n'+errs.join('\n'))}
function fpick(i){const f=i.files[0];pend.m=f;const n=$('d-name');if(f&&(!n.value.trim()||(n.dataset.auto&&n.value===n.dataset.orig)))n.value=f.name.replace(/\.[^.]+$/,'')}
function ren(id){const d=doc(id),n=prompt('Nome del documento',d.name);if(n&&n.trim()){d.name=n.trim();save();render()}}
function setSt(jid,st,g){const j=state.jobs.find(x=>x.id===jid),ng=st==='Shortlisted'?(g||j.stage||''):'';if(j.status!==st||(j.stage||'')!==ng)j.history=[...(j.history||[]),{s:st,g:ng,t:Date.now()}];j.status=st;j.stage=ng;save();render()}
function statusModal(jid){const j=state.jobs.find(x=>x.id===jid),sh=j.status==='Shortlisted';
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Stato: ${esc(j.title)}</h2><div class="filter-bar">${STAT.map(x=>`<button class="filter-chip${j.status===x?' active':''}" onclick="${x==='Shortlisted'?`setSt('${jid}','Shortlisted');statusModal('${jid}')`:`setSt('${jid}','${x}');closeModal()`}">${x}</button>`).join('')}</div>${sh?`<div style="font-size:12px;color:var(--text2);margin:2px 0 6px">Fase (Shortlisted)</div><div class="filter-bar">${STAGES.map(g=>`<button class="filter-chip${j.stage===g?' active':''}" onclick="setSt('${jid}','Shortlisted','${g}');closeModal()">${g}</button>`).join('')}</div>`:''}<div class="modal-actions"><button class="btn" onclick="closeModal()">Chiudi</button></div></div></div>`)}
const inApp=()=>$('tab-pipeline').classList.contains('active');
const modalOpen=()=>$('modal-overlay').style.display==='block';
async function auto(){if(document.hidden||!signedIn()||autoBusy||modalOpen())return;autoBusy=true;
try{if(dirty){await pull(true)}else{const r=await fetch(SU+'/rest/v1/app_state?id=eq.main&select=ts:data->>updatedAt',{headers:await H()});
if(!r.ok)await pull(true);else{const rows=await r.json(),ts=rows[0]?Number(rows[0].ts):0;if(!rows[0]||isNaN(ts)||ts!==state.updatedAt)await pull(true)}}}catch(e){}autoBusy=false}
function addDoc(jid,sel){const t=sel.value;sel.value='';if(t)docModal(t,jid)}
function linkModal(id){const d=doc(id);show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-link"></i> Collega ad application</h2><div style="font-size:13px;color:var(--text2);margin-bottom:10px">${esc(d.name)}</div>${d.type==='CL'?clJob(d):multiJob(d)}<div class="modal-actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveLinks('${id}')">Salva</button></div></div></div>`)}
function saveLinks(id){const d=doc(id);d.linkedJobs=d.type==='CL'?($('d-job1').value?[$('d-job1').value]:[]):[...document.querySelectorAll('.djl:checked')].map(x=>x.value);save();closeModal();render()}
const ctRow=c=>`<div class="ctr" style="padding:8px;border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px"><div class="field-row" style="margin-bottom:6px"><input class="ct-n" placeholder="Nome" value="${esc(c.name)}"><input class="ct-r" placeholder="Ruolo (recruiter, hiring manager...)" value="${esc(c.role)}"></div><div class="field-row"><input class="ct-e" type="email" placeholder="Email" value="${esc(c.email)}"><input class="ct-p" type="tel" placeholder="Telefono" value="${esc(c.phone)}"></div><button type="button" class="btn danger" style="margin-top:6px" onclick="this.closest('.ctr').remove()"><i class="ti ti-trash"></i> Rimuovi contatto</button></div>`;
function addCt(){const d=document.createElement('div');d.innerHTML=ctRow({});$('cts').appendChild(d.firstElementChild)}
function getCts(){return[...document.querySelectorAll('#cts .ctr')].map(r=>({name:r.querySelector('.ct-n').value.trim(),role:r.querySelector('.ct-r').value.trim(),email:r.querySelector('.ct-e').value.trim(),phone:r.querySelector('.ct-p').value.trim()})).filter(c=>c.name||c.email||c.phone)}
function histPush(old,j){j.history=(old&&old.history)||[];if(!old||old.status!==j.status||(old.stage||'')!==(j.stage||''))j.history=[...j.history,{s:j.status,g:j.stage||'',t:Date.now()}]}
async function dupDoc(id){const d=doc(id);if(!d)return;const n=Object.assign({},d,{id:uid(),name:d.name+' (copia)',linkedJobs:[],file:null,date:today()});delete n.u;delete n.trashed;
if(d.file){try{const path=n.id+'/'+Date.now()+'_'+d.file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.-]+/g,'_').slice(-80),r=await fetch(SU+'/storage/v1/object/copy',{method:'POST',headers:await H({'Content-Type':'application/json'}),body:JSON.stringify({bucketId:BK,sourceKey:d.file.path,destinationKey:path})});if(!r.ok)throw new Error('HTTP '+r.status);n.file=Object.assign({},d.file,{path})}catch(e){alert('Duplicato senza file ('+e.message+'). Caricalo con Edit.')}}
state.docs.unshift(n);save();render();docModal(n.type,null,n.id)}
async function purgeDoc(id){const d=doc(id);if(d&&d.file)await rm(d.file.path);state.docs=state.docs.filter(x=>x.id!==id)}
async function purgeJob(id){const j=state.jobs.find(x=>x.id===id);if(j&&j.vacancy)await rm(j.vacancy.path);state.jobs=state.jobs.filter(x=>x.id!==id);state.docs.forEach(d=>{d.linkedJobs=d.linkedJobs.filter(x=>x!==id)})}
async function purge(k,id){if(!confirm('Eliminare definitivamente? Non si può annullare.'))return;await(k==='j'?purgeJob(id):purgeDoc(id));save();render()}
async function emptyTrash(){if(!confirm('Svuotare il cestino? Non si può annullare.'))return;for(const j of state.jobs.filter(x=>x.trashed))await purgeJob(j.id);for(const d of state.docs.filter(x=>x.trashed))await purgeDoc(d.id);save();render()}
async function purgeOld(){if(!signedIn())return;const lim=Date.now()-30*864e5;let ch=false;for(const j of state.jobs.filter(x=>x.trashed&&x.trashed<lim)){await purgeJob(j.id);ch=true}for(const d of state.docs.filter(x=>x.trashed&&x.trashed<lim)){await purgeDoc(d.id);ch=true}if(ch){save();render()}}
function restore(k,id){const r=k==='j'?state.jobs.find(x=>x.id===id):doc(id);if(r){delete r.trashed;save();render()}}
function renderTrash(){const J=state.jobs.filter(j=>j.trashed),D=state.docs.filter(d=>d.trashed),el=$('tab-trash');if(!el)return;
const row=(k,id,name,sub,t)=>{const ago=Math.floor((Date.now()-t)/864e5);return`<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:160px"><div style="font-weight:500;font-size:14px">${esc(name)}</div><div style="font-size:12px;color:var(--text2)">${sub} · eliminato ${ago===0?'oggi':ago+' giorni fa'} · definitivo tra ${Math.max(0,30-ago)} giorni</div></div><button class="btn" onclick="restore('${k}','${id}')"><i class="ti ti-arrow-back-up"></i> Ripristina</button><button class="btn danger" onclick="purge('${k}','${id}')"><i class="ti ti-trash-x"></i> Elimina per sempre</button></div>`};
el.innerHTML=`<div class="lib-header"><div class="lib-title"><i class="ti ti-trash"></i> Cestino</div>${J.length+D.length?'<button class="btn danger" onclick="emptyTrash()">Svuota cestino</button>':''}</div><div style="font-size:12px;color:var(--text2);margin-bottom:10px">Gli elementi restano qui 30 giorni, poi vengono eliminati insieme ai loro file.</div>`+(J.length+D.length?J.map(j=>row('j',j.id,j.title,'Application · '+esc(j.org),j.trashed)).join('')+D.map(d=>row('d',d.id,d.name,TN[d.type],d.trashed)).join(''):'<div class="empty-state"><p>Il cestino è vuoto.</p></div>')}
async function backupZip(){if(typeof JSZip==='undefined')return alert('Libreria ZIP non caricata');const z=new JSZip(),it=[],fail=[];state.docs.forEach(d=>{if(d.file)it.push(['documenti/'+d.type+'/'+d.id+'_'+d.file.name,d])});state.jobs.forEach(j=>{if(j.vacancy)it.push(['vacancy/'+j.id+'_'+j.vacancy.name,{file:j.vacancy}])});
z.file('dati.json',JSON.stringify(state,null,2));let i=0;for(const[p,d]of it){ss('syncing','Backup '+(++i)+'/'+it.length+'...');try{z.file(p,await blob(d))}catch(e){fail.push(p)}}
const out=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(out);a.download='job-tracker-backup-'+today()+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);ss('ok','Backup scaricato'+(fail.length?' ('+fail.length+' file mancanti)':''));if(fail.length)alert('File non scaricati:\n'+fail.join('\n'))}
function statsModal(){const J=liveJ(),c=s=>J.filter(j=>j.status===s).length,sent=J.filter(j=>j.status!=='Wishlist').length,pos=J.filter(j=>j.status==='Shortlisted'||j.status==='Offer').length,
w=J.map(j=>{const h=j.history||[],a=h.find(x=>x.s==='Applied'),b=h.find(x=>x.s==='Shortlisted'||x.s==='Offer'||x.s==='Rejected');return a&&b&&b.t>a.t?(b.t-a.t)/864e5:null}).filter(x=>x!==null),av=w.length?Math.round(w.reduce((x,y)=>x+y,0)/w.length):null,
r=(l,v)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px"><span>${l}</span><b>${v}</b></div>`;
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-chart-bar"></i> Statistiche</h2>${STAT.map(s=>r(s,c(s))+(s==='Shortlisted'?STAGES.map(g=>r('&nbsp;&nbsp;· '+g,J.filter(j=>j.status==='Shortlisted'&&j.stage===g).length)).join(''):'')).join('')}${r('Candidature inviate',sent)}${r('Risposte positive (Shortlisted + Offer)',sent?pos+' ('+Math.round(pos/sent*100)+'%)':'-')}${r('Tempo medio di risposta',av!==null?av+' giorni ('+w.length+' casi)':'dati insufficienti: parte dai cambi di stato registrati da ora')}<div class="modal-actions"><button class="btn primary" onclick="closeModal()">Chiudi</button></div></div></div>`)}
function unlink(id){const d=doc(id);d.linkedJobs=d.linkedJobs.filter(x=>x!==eid);save();render()}
function jd(){const el=$('jdocs');if(!el)return;const L=live().filter(d=>d.linkedJobs.includes(eid));
el.innerHTML=L.length?L.map(d=>`<div class="card" style="padding:.6rem .8rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="ci ${CI[d.type]}" style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-${TI[d.type]}"></i></div>
<div style="flex:1;min-width:140px"><div style="font-size:13px;font-weight:500">${esc(d.name)}</div><div style="font-size:11px;color:var(--text2)">${TN[d.type]}${d.cvFormat?' · '+esc(d.cvFormat):''}${d.category?' · '+esc(d.category):''}${(d.topics||[]).length?' · '+d.topics.map(esc).join(', '):''}${d.file?' · '+esc(d.file.name)+' ('+fsz(d.file.size)+')':' · nessun file'}</div></div>
${d.file?`<button class="btn" onclick="dl('${d.id}')"><i class="ti ti-download"></i> Scarica</button>`:''}</div>`).join(''):'<div style="font-size:12px;color:var(--text3)">Nessun allegato.</div>'}
function docModal(t,jobId,id){const d=doc(id)||{type:t,name:'',description:'',topics:[],category:'',linkedJobs:jobId?[jobId]:[],date:today(),file:null};eid=id||null;pend.m=null;
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-${TI[t]}" style="color:${TC[t]}"></i>${id?'Edit':'New'} ${TN[t]}</h2>
<div class="field"><label>Nome (se vuoto, usa il nome del file)</label><input id="d-name" value="${esc(d.name)}" data-orig="${esc(d.name)}"${(!d.name||(d.file&&d.name===d.file.name.replace(/\.[^.]+$/,'')))?' data-auto="1"':''}></div>
<div class="field"><label>Descrizione (opzionale)</label><input id="d-desc" value="${esc(d.description)}"></div>
${t==='OTHER'?`<div class="field"><label>Tipo di documento</label>${catIn('d-cat',d.category)}</div>`:`<div class="field"><label>${TL[t]}</label>${tp('m',t,d.topics)}</div>`}
${t==='CV'?fmtSel('d-fmt',d.cvFormat):''}${t==='CL'?clJob(d,inApp()):multiJob(d,inApp())}${inApp()?'<div style="font-size:11px;color:var(--text3);margin:-6px 0 12px">Collegamenti in sola visualizzazione. Per cambiarli apri il tab Documenti (Collega o Edit).</div>':''}
<div class="field"><label>File (.pdf, .doc, .docx${t==='OTHER'?', .jpg, .png':''})${d.file?' - attuale: '+esc(d.file.name)+', scegline uno per sostituirlo':''}</label><input type="file" accept="${t==='OTHER'?ACC+',.jpg,.jpeg,.png':ACC}" onchange="fpick(this)"></div>
<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sv" onclick="saveDoc('${t}')">Save</button></div></div></div>`)}
async function saveDoc(t){if(t!=='OTHER')tadd('m');const f=pend.m,name=$('d-name').value.trim()||(f&&f.name.replace(/\.[^.]+$/,''));if(!name)return alert('Inserisci un nome o scegli un file');
const old=doc(eid),d=Object.assign({},old,{id:eid||uid(),type:t,name,description:$('d-desc').value.trim(),linkedJobs:t==='CL'?($('d-job1').value?[$('d-job1').value]:[]):[...document.querySelectorAll('.djl:checked')].map(x=>x.value),topics:t==='OTHER'?[]:[...tops.m],file:old?old.file:null,date:old?old.date:today()});
if(t==='OTHER')d.category=$('d-cat').value.trim();if(t==='CV')d.cvFormat=$('d-fmt').value;
$('sv').disabled=true;$('sv').textContent='Caricamento...';
if(f)try{const nf=await up(d.id,f),prev=d.file;d.file=nf;if(prev)rm(prev.path)}catch(e){$('sv').disabled=false;$('sv').textContent='Save';return alert('Upload non riuscito: '+e.message)}
if(old)state.docs[state.docs.indexOf(old)]=d;else state.docs.unshift(d);save();closeModal();render()}
function cvPicker(jid){const cvs=live().filter(d=>d.type==='CV');
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-id" style="color:var(--cv)"></i> CV per questa application</h2>
${cvs.length?`<div style="font-size:12px;color:var(--text2);margin-bottom:8px">Tocca per collegare o scollegare un CV. Lo stesso CV può stare in più application</div><div class="cv-pick-list">${cvs.map(d=>`<div class="cv-pick-item${d.linkedJobs.includes(jid)?' sel':''}" onclick="linkCv('${d.id}','${jid}')"><div style="flex:1"><b style="font-size:13px">${esc(d.name)}</b><div>${(d.topics||[]).map(t=>`<span class="tag ${tc(t)}">${esc(t)}</span>`).join(' ')}</div></div>${d.linkedJobs.includes(jid)?'<i class="ti ti-check" style="color:var(--cv)"></i>':''}</div>`).join('')}</div>`:'<p style="font-size:13px;color:var(--text2)">Nessun CV salvato.</p>'}
<div class="modal-actions"><button class="btn" onclick="closeModal()">Chiudi</button><button class="btn btn-cv" onclick="closeModal();docModal('CV','${jid}')"><i class="ti ti-plus"></i> Nuovo CV</button></div></div></div>`)}
function linkCv(id,jid){const d=doc(id),i=d.linkedJobs.indexOf(jid);if(i>=0)d.linkedJobs.splice(i,1);else d.linkedJobs.push(jid);save();render();cvPicker(jid)}
function delJob(id){const j=state.jobs.find(x=>x.id===id);if(!j||!confirm('Spostare questa application nel cestino? Potrai ripristinarla per 30 giorni.'))return;j.trashed=Date.now();save();render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='job-tracker-metadata.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{const p=JSON.parse(x.target.result);state.jobs=p.jobs||[];state.docs=p.docs||[];norm();save();render()}catch(err){alert('File non valido')}};r.readAsText(f)}
load();render();if(signedIn())pull();else{ss('err','Non connesso');$('setup').style.display='flex'}
document.addEventListener('visibilitychange',auto);addEventListener('focus',auto);addEventListener('online',auto);setInterval(auto,10000);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
