<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#185fa5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">

<title>Job Tracker – Liviu</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#fafaf9;
  --text:#1a1a1a;--text2:#6b7280;--text3:#9ca3af;
  --border:rgba(0,0,0,0.11);--border2:rgba(0,0,0,0.22);
  --radius:8px;--radius-lg:12px;
  --font:'Inter',system-ui,sans-serif;
  --cl:#185fa5;--cl-bg:#e6f1fb;--cl-hover:#cde2f7;
  --cv:#3b6d11;--cv-bg:#eaf3de;--cv-hover:#d2ecb4;
  --app:#6d3eb5;--app-bg:#f0eafd;--app-hover:#e2d5fb;
  --other:#8a5a00;--other-bg:#fdf3e0;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#111;
  --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.20);
}}
body{font-family:var(--font);background:var(--bg3);color:var(--text);min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:2rem 1.5rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
h1{font-size:20px;font-weight:500;display:flex;align-items:center;gap:8px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:.85rem 1rem}
.stat-card .label{font-size:11px;color:var(--text2);margin-bottom:3px}
.stat-card .value{font-size:20px;font-weight:500}
/* tabs */
.tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:1.5rem;overflow-x:auto}
.tab{padding:9px 18px;font-size:13px;background:none;border:none;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.tab:hover:not(.active){color:var(--text)}
.section{display:none}.section.active{display:block}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:none;cursor:pointer;color:var(--text);font-family:var(--font)}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.84}
.btn.danger{color:#a32d2d;border-color:#f7c1c1}
.btn.danger:hover{background:#fcebeb}
.btn-cl{background:var(--cl-bg);color:var(--cl);border-color:var(--cl-bg);font-weight:500}
.btn-cl:hover{background:var(--cl-hover)}
.btn-cv{background:var(--cv-bg);color:var(--cv);border-color:var(--cv-bg);font-weight:500}
.btn-cv:hover{background:var(--cv-hover)}
.btn-app{background:var(--app-bg);color:var(--app);border-color:var(--app-bg);font-weight:500}
.btn-app:hover{background:var(--app-hover)}
.btn-other{background:var(--other-bg);color:var(--other);border-color:var(--other-bg);font-weight:500}
.btn-other:hover{opacity:.85}
/* cards */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:10px}
.card:hover{border-color:var(--border2)}
.job-title{font-size:15px;font-weight:500;margin-bottom:2px}
.job-org{font-size:13px;color:var(--text2)}
.job-meta{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.job-meta span,.job-meta a{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;text-decoration:none}
.job-meta a:hover{color:var(--text)}
/* doc chips on job card */
.job-docs-section{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)}
.job-docs-type-row{margin-bottom:8px}
.job-docs-type-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.doc-chips{display:flex;flex-wrap:wrap;gap:6px}
.doc-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);font-size:12px;cursor:pointer;max-width:240px}
.doc-chip:hover{border-color:var(--border2)}
.doc-chip .ci{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.ci-cl{background:var(--cl-bg);color:var(--cl)}
.ci-cv{background:var(--cv-bg);color:var(--cv)}
.ci-app{background:var(--app-bg);color:var(--app)}
.ci-other{background:var(--other-bg);color:var(--other)}
.doc-chip .chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.doc-add-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.job-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border);flex-wrap:wrap}
/* badges */
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.badge-applied{background:#e6f1fb;color:#185fa5}
.badge-interview{background:#faeeda;color:#854f0b}
.badge-offer{background:#eaf3de;color:#3b6d11}
.badge-rejected{background:#fcebeb;color:#a32d2d}
.badge-wishlist{background:#f1efe8;color:#5f5e5a}
.badge-test{background:#eeedfe;color:#534ab7}
/* filter */
.filter-bar{display:flex;gap:7px;margin-bottom:1.2rem;flex-wrap:wrap}
.filter-chip{padding:5px 11px;font-size:12px;border:0.5px solid var(--border);border-radius:20px;background:none;cursor:pointer;color:var(--text2);font-family:var(--font)}
.filter-chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.sort-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.sort-bar label{font-size:12px;color:var(--text2)}
.sort-bar select{font-size:12px;padding:5px 8px;width:auto;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font)}
/* lib */
.lib-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.lib-title{font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px}
.lib-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lib-controls select{font-size:13px;padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font)}
.topic-group{margin-bottom:1.75rem}
.topic-group-title{font-size:13px;font-weight:600;padding-bottom:8px;border-bottom:0.5px solid var(--border);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.topic-group-title .count{font-weight:400;color:var(--text3);font-size:12px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lib-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:9px}
.lib-card:hover{border-color:var(--border2)}
.lib-card-header{display:flex;align-items:flex-start;gap:9px}
.lib-card-icon{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.lib-card-icon.cl{background:var(--cl-bg);color:var(--cl)}
.lib-card-icon.cv{background:var(--cv-bg);color:var(--cv)}
.lib-card-icon.app{background:var(--app-bg);color:var(--app)}
.lib-card-icon.other{background:var(--other-bg);color:var(--other)}
.lib-card-name{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:1px}
.lib-card-sub{font-size:11px;color:var(--text2)}
.lib-card-desc{font-size:12px;color:var(--text2);line-height:1.55}
.lib-card-tags{display:flex;flex-wrap:wrap;gap:4px}
.lib-card-linked{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.lib-card-footer{display:flex;gap:5px;padding-top:8px;border-top:0.5px solid var(--border);flex-wrap:wrap}
/* tags */
.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag-0{background:#e6f1fb;color:#185fa5}.tag-1{background:#eeedfe;color:#534ab7}
.tag-2{background:#faeeda;color:#854f0b}.tag-3{background:#eaf3de;color:#3b6d11}
.tag-4{background:#f3f0fe;color:#6d4c9e}.tag-5{background:#fce8fb;color:#8b2580}
.tag-6{background:#e0f5f0;color:#1a6650}.tag-7{background:#fdf3e0;color:#8a5a00}
.tag-8{background:#f1efe8;color:#5f5e5a}.tag-9{background:#fcebeb;color:#a32d2d}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.44);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:1.5rem 1rem;overflow-y:auto}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);width:100%;max-width:600px;padding:1.5rem}
.modal.xl{max-width:800px}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1.2rem;display:flex;align-items:center;gap:8px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text)}
.field textarea{resize:vertical;min-height:100px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.2rem;padding-top:1rem;border-top:0.5px solid var(--border)}
/* doc block inside modal */
.doc-block{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:10px;background:var(--bg2)}
.doc-block-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.doc-block-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.doc-block-fields{display:flex;flex-direction:column;gap:10px}
.doc-block.collapsed .doc-block-fields{display:none}
.doc-block-toggle{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;display:flex;align-items:center;gap:4px;font-family:var(--font);padding:0}
.doc-block-toggle:hover{color:var(--text)}
/* drop zone */
.drop-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:.9rem;text-align:center;cursor:pointer;background:var(--bg);position:relative;transition:all .12s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--text)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-row{display:flex;align-items:center;gap:8px;justify-content:center}
.dz-icon{font-size:18px;color:var(--text2)}
.dz-label{font-size:12px;color:var(--text2)}
.dz-sub{font-size:11px;color:var(--text3)}
.upload-status{font-size:11px;padding:4px 8px;border-radius:var(--radius);margin-top:5px;display:none}
.upload-status.ok{background:#eaf3de;color:#3b6d11;display:block}
.upload-status.err{background:#fcebeb;color:#a32d2d;display:block}
.upload-status.loading{background:var(--bg2);color:var(--text2);display:block}
/* topic input */
.topic-wrap{position:relative}
.topic-sug{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);z-index:300;max-height:160px;overflow-y:auto;display:none;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.topic-sug.open{display:block}
.topic-sug-item{padding:7px 12px;font-size:13px;cursor:pointer}
.topic-sug-item:hover{background:var(--bg2)}
.topic-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.topic-chip-wrap{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 4px 2px 7px;border-radius:20px;border:0.5px solid var(--border)}
.topic-chip-wrap button{background:none;border:none;cursor:pointer;color:var(--text3);display:flex;align-items:center;padding:1px;border-radius:50%}
.topic-chip-wrap button:hover{color:var(--text)}
/* cv picker */
.cv-pick-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;margin-top:4px}
.cv-pick-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border:0.5px solid var(--border);border-radius:var(--radius);cursor:pointer}
.cv-pick-item:hover{border-color:var(--border2);background:var(--bg2)}
.cv-pick-item.sel{border-color:var(--cv);background:var(--cv-bg)}
/* empty */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty-state .icon{font-size:36px;margin-bottom:10px;color:var(--border2)}
.empty-state p{font-size:13px;line-height:1.7}
/* section divider */
.modal-divider{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);margin:1.25rem 0 .75rem;padding-top:1rem;border-top:0.5px solid var(--border);display:flex;align-items:center;gap:7px}

/* ── iOS / PWA ── */
:root {
  --sat: env(safe-area-inset-top);
  --sar: env(safe-area-inset-right);
  --sab: env(safe-area-inset-bottom);
  --sal: env(safe-area-inset-left);
}
html { height: -webkit-fill-available; }
body {
  min-height: -webkit-fill-available;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
.pwa-header {
  display: none;
  position: sticky;
  top: 0; left: 0; right: 0;
  z-index: 50;
  background: var(--bg3);
  border-bottom: 0.5px solid var(--border);
  padding: calc(var(--sat) + .6rem) calc(var(--sar) + 1rem) .6rem calc(var(--sal) + 1rem);
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.bottom-tabs {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding-bottom: var(--sab);
  background: var(--bg);
  border-top: 0.5px solid var(--border);
  z-index: 100;
}
.bottom-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 7px 2px 5px;
  font-size: 9px;
  color: var(--text2);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  gap: 2px;
  -webkit-tap-highlight-color: transparent;
}
.bottom-tab i { font-size: 21px; }
.bottom-tab.active { color: var(--cl); }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; margin-left: 4px; vertical-align: middle; flex-shrink: 0;
}
.sync-dot.ok { background: #3b6d11; }
.sync-dot.syncing { background: #854f0b; animation: pulse .8s infinite alternate; }
.sync-dot.err { background: #a32d2d; }
@keyframes pulse { from { opacity:1 } to { opacity:.3 } }
.sync-bar {
  font-size: 11px; color: var(--text2);
  padding: 5px 1.5rem;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 0.5px solid var(--border);
  background: var(--bg3);
}
/* Setup modal overlay */
.setup-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 500; padding: 1.5rem;
}
.setup-box {
  background: var(--bg); border-radius: var(--radius-lg);
  padding: 1.75rem; width: 100%; max-width: 440px;
  border: 0.5px solid var(--border);
}
.setup-box h2 { font-size: 16px; font-weight: 600; margin-bottom: .5rem; display:flex;align-items:center;gap:8px }
.setup-box p { font-size: 13px; color: var(--text2); margin-bottom: 1.25rem; line-height: 1.6 }
.setup-box input {
  width: 100%; padding: 9px 11px; font-size: 13px;
  border: 0.5px solid var(--border2); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-family: var(--font);
  outline: none; margin-bottom: 10px;
}
.setup-box input:focus { border-color: var(--text); }
.setup-box .hint { font-size: 11px; color: var(--text3); margin-bottom: 1rem; line-height: 1.5 }
@media (max-width: 640px) {
  .pwa-header { display: flex; }
  .bottom-tabs { display: flex; }
  .top-bar { display: none; }
  .tabs { display: none; }
  .app { padding: 0; max-width: 100%; }
  .scroll-area {
    padding: .75rem calc(var(--sar) + .9rem) calc(var(--sab) + 72px) calc(var(--sal) + .9rem);
  }
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal {
    border-radius: 20px 20px 0 0;
    max-width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal.xl { max-width: 100%; }
  .btn { min-height: 38px; }
  .filter-chip { min-height: 34px; }
  .lib-grid { grid-template-columns: 1fr; }
}
@media (min-width: 641px) {
  .pwa-header { display: none !important; }
  .bottom-tabs { display: none !important; }
  .scroll-area { padding: 2rem 1.5rem; }
}


.rem{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;font-weight:500;margin-top:8px}
.rem.red{background:#fcebeb;color:#a32d2d}.rem.amber{background:#faeeda;color:#854f0b}.rem.grey{background:var(--bg2);color:var(--text2)}
.ic{padding:2px 5px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:14px}.ic:hover{color:var(--text)}
.ic.del:hover{color:#a32d2d}
</style></head><body>
<div class="setup-overlay" id="setup" style="display:none"><div class="setup-box"><h2><i class="ti ti-cloud"></i> Sync e file</h2>
<p>Inserisci la chiave anon di Supabase (Settings, API). Resta salvata solo su questo dispositivo.</p>
<input id="setup-key" type="password" placeholder="eyJ..." autocomplete="off">
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="$('setup').style.display='none'">Salta</button><button class="btn primary" onclick="saveKey('setup-key')">Salva e connetti</button></div></div></div>
<div class="pwa-header"><h1 style="font-size:17px;font-weight:600"><i class="ti ti-briefcase"></i> Job Tracker</h1>
<div style="display:flex;gap:6px;align-items:center"><span class="sync-dot ok" id="sd1"></span><button class="btn primary" onclick="jobModal()"><i class="ti ti-plus"></i> New</button><button class="btn" onclick="pull()"><i class="ti ti-refresh"></i> Sync</button></div></div>
<div class="sync-bar"><span class="sync-dot ok" id="sd2"></span><span id="sl">Avvio…</span><span style="flex:1"></span>
<button class="btn" style="font-size:11px;padding:3px 8px" onclick="pull()"><i class="ti ti-refresh"></i> Sync</button>
<button class="btn" style="font-size:11px;padding:3px 8px" onclick="settings()"><i class="ti ti-settings"></i> Impostazioni</button></div>
<div class="bottom-tabs">
<button class="bottom-tab active" data-tab="pipeline" onclick="tab('pipeline')"><i class="ti ti-layout-list"></i>Pipeline</button>
<button class="bottom-tab" data-tab="CL" onclick="tab('CL')"><i class="ti ti-file-text"></i>CL</button>
<button class="bottom-tab" data-tab="CV" onclick="tab('CV')"><i class="ti ti-id"></i>CV</button>
<button class="bottom-tab" data-tab="APP" onclick="tab('APP')"><i class="ti ti-forms"></i>Forms</button>
<button class="bottom-tab" data-tab="OTHER" onclick="tab('OTHER')"><i class="ti ti-files"></i>Supporting</button></div>
<div class="app"><div class="scroll-area">
<div class="top-bar"><h1><i class="ti ti-briefcase"></i> Job tracker</h1><div style="display:flex;gap:8px"><button class="btn primary" onclick="jobModal()"><i class="ti ti-plus"></i> New application</button><button class="btn" onclick="exportData()"><i class="ti ti-download"></i> Export</button><label class="btn" style="cursor:pointer"><i class="ti ti-upload"></i> Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label></div></div>
<div class="stats-row" id="stats"></div>
<div class="tabs"><button class="tab active" data-tab="pipeline" onclick="tab('pipeline')"><i class="ti ti-layout-list"></i> Pipeline</button><button class="tab" data-tab="CL" onclick="tab('CL')"><i class="ti ti-file-text"></i> Cover letters</button><button class="tab" data-tab="CV" onclick="tab('CV')"><i class="ti ti-id"></i> CVs</button><button class="tab" data-tab="APP" onclick="tab('APP')"><i class="ti ti-forms"></i> App forms</button><button class="tab" data-tab="OTHER" onclick="tab('OTHER')"><i class="ti ti-files"></i> Supporting docs</button></div>
<div id="tab-pipeline" class="section active">
<div class="filter-bar" id="fbar"></div>
<div class="sort-bar"><label>Sort by</label><select id="sort" onchange="renderPipeline()"><option value="date">Newest first</option><option value="fu">Follow-up date</option><option value="alpha">Company A-Z</option></select></div>
<div id="pipeline-list"></div></div>
<div id="tab-CL" class="section"></div><div id="tab-CV" class="section"></div><div id="tab-APP" class="section"></div><div id="tab-OTHER" class="section"></div>
</div></div>
<div id="modal-overlay" style="display:none"></div>
<input type="file" id="rep" style="display:none" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="repPicked(this)">
<script>
const $=id=>document.getElementById(id);
const SK='jt_v6',KS='supa_key_jt',SU='https://oawhoqfdajpyosecsyls.supabase.co',BK='job-files';
let state={jobs:[],docs:[],updatedAt:0},filt='active',eid=null,pend={},tops={},urls=[],bc=0,pt=null,repId=null;
const TP={CL:['Policy','Stakeholder engagement','Project management','Procurement','Evaluation & monitoring','Communications','Data & knowledge management','Finance & budget','Research & innovation','General'],
CV:['EU Consultant','Programme Manager','Policy Analyst','Project Manager (PRINCE2)','Data & Knowledge Mgmt (CDMP)','EU Official / Institution','Senior Manager'],
APP:['European Commission','EU Agency','European Parliament','Council of the EU','Private sector','NGO / Think tank']};
const CATS=['Work contract','ID doc','Payslip','Judicial document','Diploma / degree','Reference letter','Certificate','Other'];
const TN={CL:'Cover letter',CV:'CV',APP:'Application form',OTHER:'Supporting document'};
const TL={CL:'Topics',CV:'Profile / specialisation',APP:'Institution type'};
const TI={CL:'file-text',CV:'id',APP:'forms',OTHER:'files'};
const TC={CL:'var(--cl)',CV:'var(--cv)',APP:'var(--app)',OTHER:'var(--other)'};
const CI={CL:'ci-cl',CV:'ci-cv',APP:'ci-app',OTHER:'ci-other'};
const STAT=['Wishlist','Applied','Test/Assessment','Interview','Offer','Rejected'];
const MIME={pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png'};
const ACC='.pdf,.doc,.docx'+'';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fd_=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const fsz=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const mimeOf=n=>MIME[(n.split('.').pop()||'').toLowerCase()]||'application/octet-stream';
const key=()=>localStorage.getItem(KS)||'';
const hdr=x=>Object.assign({apikey:key(),Authorization:'Bearer '+key()},x||{});
const doc=id=>state.docs.find(d=>d.id===id);
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
function days(s){if(!s)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+'T00:00:00')-t)/864e5)}
// ---- state ----
function norm(){state.jobs=state.jobs||[];state.docs=(state.docs||[]).map(d=>Object.assign({topics:[],description:'',file:null},d,{type:['CL','CV','APP','OTHER'].includes(d.type)?d.type:'CL'}))}
function load(){try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s)state=Object.assign(state,s)}catch(e){}norm();localStorage.removeItem('gh_token_jt')}
function persist(){try{localStorage.setItem(SK,JSON.stringify(state))}catch(e){}}
function save(){state.updatedAt=Date.now();persist();clearTimeout(pt);pt=setTimeout(push,1500)}
// ---- sync (Supabase) ----
function ss(c,m){['sd1','sd2'].forEach(i=>{if($(i))$(i).className='sync-dot '+c});$('sl').textContent=m}
async function pull(){if(!key())return ss('err','Sync non configurato: apri le impostazioni');ss('syncing','Sincronizzazione...');
try{const r=await fetch(SU+'/rest/v1/app_state?id=eq.main&select=data',{headers:hdr()});
if(r.status==401||r.status==403)return ss('err','Chiave non valida');
if(r.status==404)return ss('err','Tabella app_state mancante: esegui lo SQL');
if(!r.ok)throw new Error('HTTP '+r.status);
const rows=await r.json(),rd=rows[0]&&rows[0].data;
if(!rd||(rd.updatedAt||0)<state.updatedAt){await push();return}
if(rd.updatedAt>state.updatedAt){state.jobs=rd.jobs||[];state.docs=rd.docs||[];state.updatedAt=rd.updatedAt;norm();persist();render()}
ss('ok','Sincronizzato '+new Date().toLocaleTimeString())}catch(e){ss('err','Errore: '+e.message)}}
async function push(){if(!key())return;ss('syncing','Salvataggio...');
try{const r=await fetch(SU+'/rest/v1/app_state?on_conflict=id',{method:'POST',headers:hdr({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:'main',data:state})});
if(!r.ok)throw new Error('HTTP '+r.status);ss('ok','Salvato '+new Date().toLocaleTimeString())}catch(e){ss('err','Errore: '+e.message)}}
function saveKey(i){const v=$(i).value.trim();if(v.length<40)return alert('Chiave non valida');localStorage.setItem(KS,v);$('setup').style.display='none';closeModal();pull()}
function settings(){show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-settings"></i> Impostazioni sync</h2>
<div class="field"><label>Chiave anon Supabase</label><input id="sk" type="password" value="${esc(key())}"></div>
<div class="modal-actions"><button class="btn danger" onclick="localStorage.removeItem('${KS}');closeModal();ss('err','Chiave rimossa')">Rimuovi</button><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveKey('sk')">Salva</button></div></div></div>`)}
// ---- files (Supabase Storage) ----
async function up(id,f){if(!key())throw new Error('Chiave Supabase mancante (impostazioni)');if(f.size>25*1048576)throw new Error('File oltre 25 MB');
const path=id+'/'+Date.now()+'_'+f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.-]+/g,'_').slice(-80),mime=f.type||mimeOf(f.name);
const fd=new FormData();fd.append('cacheControl','3600');fd.append('',new File([f],f.name,{type:mime}));
const r=await fetch(SU+'/storage/v1/object/'+BK+'/'+path,{method:'POST',headers:Object.assign(hdr(),{'x-upsert':'true'}),body:fd});
if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(m||'HTTP '+r.status)}
return{path,name:f.name,mime,size:f.size}}
async function rm(p){try{await fetch(SU+'/storage/v1/object/'+BK,{method:'DELETE',headers:hdr({'Content-Type':'application/json'}),body:JSON.stringify({prefixes:[p]})})}catch(e){}}
async function blob(d){const r=await fetch(SU+'/storage/v1/object/'+BK+'/'+d.file.path,{headers:hdr()});if(!r.ok)throw new Error('HTTP '+r.status);return new Blob([await r.blob()],{type:d.file.mime||mimeOf(d.file.name)})}
async function dl(id){const d=doc(id);try{const b=await blob(d),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){alert('Download non riuscito: '+e.message)}}
function pick(id){repId=id;$('rep').click()}
async function repPicked(i){const f=i.files[0];i.value='';if(!f||!repId)return;const d=doc(repId);try{const nf=await up(d.id,f),old=d.file;d.file=nf;save();render();if(old)rm(old.path)}catch(e){alert('Upload non riuscito: '+e.message)}}
async function delDoc(id){const d=doc(id);if(!confirm('Eliminare "'+d.name+'" e il suo file?'))return;if(d.file)await rm(d.file.path);state.docs=state.docs.filter(x=>x.id!==id);save();render()}
async function viewDoc(id){const d=doc(id);if(!d)return;
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal xl"><h2><i class="ti ti-${TI[d.type]}" style="color:${TC[d.type]}"></i> ${esc(d.name)}</h2>
<div style="font-size:12px;color:var(--text2);margin-bottom:8px">${esc(d.category||'')} ${(d.topics||[]).map(t=>'<span class="tag '+tc(t)+'">'+esc(t)+'</span>').join(' ')} ${esc(d.description)}</div>
<div id="vb" style="max-height:68vh;overflow:auto;border:0.5px solid var(--border);border-radius:var(--radius);padding:.75rem;font-size:13px;line-height:1.6;background:var(--bg2)">Caricamento...</div>
<div class="modal-actions">${d.file?`<button class="btn" onclick="dl('${d.id}')"><i class="ti ti-download"></i> Scarica</button>`:''}<button class="btn" onclick="closeModal();docModal('${d.type}',null,'${d.id}')"><i class="ti ti-edit"></i> Edit</button><button class="btn primary" onclick="closeModal()">Chiudi</button></div></div></div>`);
const v=$('vb');if(!d.file){v.style.whiteSpace='pre-wrap';v.textContent=d.content||'Nessun file caricato. Usa Edit o "nuova versione" per caricarlo.';return}
try{const b=await blob(d),n=d.file.name.toLowerCase();
if(n.endsWith('.pdf')){const u=URL.createObjectURL(b);urls.push(u);v.style.padding='0';v.innerHTML=`<iframe src="${u}" style="width:100%;height:66vh;border:0"></iframe>`}
else if(n.endsWith('.docx')){const r=await mammoth.convertToHtml({arrayBuffer:await b.arrayBuffer()});v.style.background='#fff';v.style.color='#111';v.innerHTML=r.value}
else if(/\.(jpe?g|png)$/.test(n)){const u=URL.createObjectURL(b);urls.push(u);v.innerHTML=`<img src="${u}" style="max-width:100%">`}
else v.textContent='Anteprima non disponibile per questo formato. Usa Scarica.'}catch(e){v.textContent='Errore: '+e.message}}
// ---- topics ----
function tc(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))&65535;return 'tag-'+h%10}
function tchips(k){return(tops[k]||[]).map(t=>`<span class="topic-chip-wrap"><span class="tag ${tc(t)}">${esc(t)}</span><button data-t="${esc(t)}" onclick="trem('${k}',this.dataset.t)"><i class="ti ti-x" style="font-size:11px"></i></button></span>`).join('')}
function tp(k,type,init){tops[k]=[...(init||[])];return `<div class="topic-wrap"><input id="ti-${k}" autocomplete="off" placeholder="Scrivi e premi Invio (testo libero)" oninput="tsug('${k}','${type}')" onkeydown="if(event.key==='Enter'||event.key===','){event.preventDefault();tadd('${k}')}" onblur="setTimeout(()=>tadd('${k}'),150)"><div class="topic-sug" id="ts-${k}"></div></div><div class="topic-chips" id="tc-${k}">${tchips(k)}</div>`}
function tsug(k,type){const i=$('ti-'+k),b=$('ts-'+k),q=i.value.toLowerCase();if(!q)return b.classList.remove('open');
const m=(TP[type]||[]).filter(t=>t.toLowerCase().includes(q)&&!tops[k].includes(t));if(!m.length)return b.classList.remove('open');
b.innerHTML=m.map(t=>`<div class="topic-sug-item" data-t="${esc(t)}" onmousedown="event.preventDefault();tpick('${k}',this.dataset.t)">${esc(t)}</div>`).join('');b.classList.add('open')}
function tpick(k,t){if(!tops[k].includes(t))tops[k].push(t);$('ti-'+k).value='';$('ts-'+k).classList.remove('open');$('tc-'+k).innerHTML=tchips(k)}
function tadd(k){const i=$('ti-'+k);if(!i)return;const v=i.value.trim().replace(/,$/,'');if(v&&!tops[k].includes(v))tops[k].push(v);i.value='';$('ts-'+k).classList.remove('open');$('tc-'+k).innerHTML=tchips(k)}
function trem(k,t){tops[k]=tops[k].filter(x=>x!==t);$('tc-'+k).innerHTML=tchips(k)}
const catIn=(id,v)=>`<input id="${id}" list="cats" value="${esc(v||'')}" placeholder="Work contract, ID doc, Payslip... (testo libero)"><datalist id="cats">${CATS.map(c=>`<option value="${c}">`).join('')}</datalist>`;
// ---- render ----
function render(){stats();bar();renderPipeline();['CL','CV','APP','OTHER'].forEach(lib);jd()}
function stats(){const j=state.jobs,n=s=>j.filter(x=>x.status===s).length;
$('stats').innerHTML=[['Applications',j.length],['Active',j.filter(x=>x.status!=='Rejected').length],['Interviews',n('Interview')],['Offers',n('Offer')],['Rejected',n('Rejected')]].map(([l,v])=>`<div class="stat-card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('')}
function bar(){$('fbar').innerHTML=[['active','Active'],...STAT.map(s=>[s,s]),['all','All']].map(([k,l])=>`<button class="filter-chip${filt===k?' active':''}" onclick="filt='${k}';bar();renderPipeline()">${l}</button>`).join('')}
function rem(j){if(j.status==='Rejected'||j.status==='Wishlist')return'';const n=days(j.followUpDate),sc=days(j.lastContact);
if(n!==null){if(n<0)return`<div class="rem red"><i class="ti ti-alert-triangle"></i> Follow-up scaduto da ${-n} ${-n==1?'giorno':'giorni'}: invia un sollecito</div>`;
if(n===0)return'<div class="rem amber"><i class="ti ti-bell-ringing"></i> Follow-up oggi</div>';
if(n<=3)return`<div class="rem amber"><i class="ti ti-bell"></i> Follow-up tra ${n} ${n==1?'giorno':'giorni'}</div>`;
return`<div class="rem grey"><i class="ti ti-bell"></i> Follow-up il ${fd_(j.followUpDate)}</div>`}
if(sc!==null&&-sc>=14&&j.status!=='Offer')return`<div class="rem amber"><i class="ti ti-clock-exclamation"></i> Nessun contatto da ${-sc} giorni: valuta un sollecito</div>`;return''}
function renderPipeline(){let a=[...state.jobs];if(filt==='active')a=a.filter(j=>j.status!=='Rejected');else if(filt!=='all')a=a.filter(j=>j.status===filt);
const s=$('sort').value;if(s==='alpha')a.sort((x,y)=>x.org.localeCompare(y.org));else if(s==='fu')a.sort((x,y)=>(x.followUpDate||'9999').localeCompare(y.followUpDate||'9999'));else a.sort((x,y)=>(y.date||'').localeCompare(x.date||''));
$('pipeline-list').innerHTML=a.length?a.map(jobCard).join(''):'<div class="empty-state"><div class="icon"><i class="ti ti-briefcase-off"></i></div><p>Nessuna application in questa vista.</p></div>'}
function chip(d){return`<div class="doc-chip" title="${esc(d.name)}" onclick="viewDoc('${d.id}')"><div class="ci ${CI[d.type]}"><i class="ti ti-${TI[d.type]}"></i></div><span class="chip-name">${esc(d.name)}${d.category?' ('+esc(d.category)+')':''}</span>${d.file?'':'<small style="color:var(--text3)">no file</small>'}</div>`}
function jobCard(j){const L=state.docs.filter(d=>d.linkedJob===j.id);
const secs=['CL','CV','APP','OTHER'].map(t=>{const x=L.filter(d=>d.type===t);return x.length?`<div class="job-docs-type-row"><div class="job-docs-type-label" style="color:${TC[t]}"><i class="ti ti-${TI[t]}"></i>${t==='OTHER'?'Supporting documents':TN[t]+'s'}</div><div class="doc-chips">${x.map(chip).join('')}</div></div>`:''}).join('');
return`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="job-title">${esc(j.title)}</div><div class="job-org">${esc(j.org)}${j.location?' · '+esc(j.location):''}</div></div><span class="badge badge-${({Applied:'applied',Interview:'interview',Offer:'offer',Rejected:'rejected',Wishlist:'wishlist','Test/Assessment':'test'})[j.status]}">${j.status}</span></div>
<div class="job-meta"><span><i class="ti ti-calendar"></i>${fd_(j.date)}</span>${j.deadline?`<span><i class="ti ti-calendar-due"></i>Deadline ${fd_(j.deadline)}</span>`:''}${j.url?`<a href="${esc(j.url)}" target="_blank"><i class="ti ti-external-link"></i>Job post</a>`:''}
${j.lastContact?`<span><i class="ti ti-message"></i>Ultimo contatto ${fd_(j.lastContact)}</span>`:''}${j.contactEmail?`<a href="mailto:${esc(j.contactEmail)}"><i class="ti ti-mail"></i>${esc(j.contactEmail)}</a>`:''}</div>
${rem(j)}${j.notes?`<div style="font-size:12px;color:var(--text2);margin-top:8px;padding:7px 10px;background:var(--bg2);border-radius:var(--radius)">${esc(j.notes)}</div>`:''}
<div class="job-docs-section">${secs||'<div style="font-size:12px;color:var(--text3);margin-bottom:6px">Nessun documento</div>'}
<div class="doc-add-row"><button class="btn btn-cl" onclick="docModal('CL','${j.id}')"><i class="ti ti-plus"></i> Cover letter</button><button class="btn btn-cv" onclick="cvPicker('${j.id}')"><i class="ti ti-plus"></i> CV</button><button class="btn btn-app" onclick="docModal('APP','${j.id}')"><i class="ti ti-plus"></i> App form</button><button class="btn btn-other" onclick="docModal('OTHER','${j.id}')"><i class="ti ti-plus"></i> Supporting documents</button></div></div>
<div class="job-actions"><button class="btn" onclick="jobModal('${j.id}')"><i class="ti ti-edit"></i> Edit</button><button class="btn" style="background:#fcebeb;color:#a32d2d;border-color:#f7c1c1;font-weight:500" onclick="delJob('${j.id}')"><i class="ti ti-trash"></i> Delete</button></div></div>`}
function lib(t){const el=$('tab-'+t),L=state.docs.filter(d=>d.type===t),f=$('flt-'+t)?$('flt-'+t).value:'';
const keys=d=>t==='OTHER'?[d.category||'Other']:t==='APP'?['']:(d.topics&&d.topics.length?d.topics:['(nessuno)']);
const all=[...new Set(L.flatMap(keys))].filter(Boolean).sort();
const sel=(t==='CL'||t==='CV')?`<select id="flt-${t}" onchange="lib('${t}')"><option value="">Tutti</option>${all.map(k=>`<option${k===f?' selected':''}>${esc(k)}</option>`).join('')}</select>`:'';
const G={};L.forEach(d=>keys(d).forEach(k=>{if(!f||k===f)(G[k]=G[k]||[]).push(d)}));
el.innerHTML=`<div class="lib-header"><div class="lib-title" style="color:${TC[t]}"><i class="ti ti-${TI[t]}"></i> ${t==='OTHER'?'Supporting documents':TN[t]+'s'}</div><div class="lib-controls">${sel}<button class="btn" onclick="docModal('${t}')"><i class="ti ti-plus"></i> New</button></div></div>`+
(L.length?Object.keys(G).sort().map(k=>`<div class="topic-group">${k?`<div class="topic-group-title">${esc(k)} <span class="count">${G[k].length}</span></div>`:''}<div class="lib-grid">${G[k].map(card).join('')}</div></div>`).join(''):'<div class="empty-state"><p>Ancora nessun documento.</p></div>')}
function card(d){const j=state.jobs.find(x=>x.id===d.linkedJob);return`<div class="lib-card"><div class="lib-card-header"><div class="lib-card-icon ${d.type.toLowerCase()}"><i class="ti ti-${TI[d.type]}"></i></div><div style="flex:1;min-width:0"><div class="lib-card-name">${esc(d.name)}</div><div class="lib-card-sub">${d.file?esc(d.file.name)+' · '+fsz(d.file.size):'nessun file'}</div></div></div>
${(d.topics||[]).length?`<div class="lib-card-tags">${d.topics.map(t=>`<span class="tag ${tc(t)}">${esc(t)}</span>`).join('')}</div>`:''}${d.description?`<div class="lib-card-desc">${esc(d.description)}</div>`:''}${j?`<div class="lib-card-linked"><i class="ti ti-link"></i>${esc(j.org)}</div>`:''}
<div class="lib-card-footer"><button class="btn" onclick="viewDoc('${d.id}')"><i class="ti ti-eye"></i> View</button>${d.file?`<button class="btn" onclick="dl('${d.id}')"><i class="ti ti-download"></i> Download</button>`:''}<button class="btn" onclick="docModal('${d.type}',null,'${d.id}')"><i class="ti ti-edit"></i> Edit</button><button class="btn danger" onclick="delDoc('${d.id}')"><i class="ti ti-trash"></i> Delete</button></div></div>`}
function tab(t){document.querySelectorAll('.tab,.bottom-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t))}
// ---- modals ----
function show(h){const o=$('modal-overlay');o.innerHTML=h;o.style.display='block'}
function closeModal(){const o=$('modal-overlay');o.style.display='none';o.innerHTML='';urls.forEach(u=>URL.revokeObjectURL(u));urls=[];eid=null;pend={};tops={}}
function blk(t){const b='b'+(++bc);return`<div class="doc-block" data-b="${b}" data-t="${t}"><div class="doc-block-header"><div class="doc-block-title" style="color:${TC[t]}"><i class="ti ti-${TI[t]}"></i>${TN[t]}</div><button class="btn danger" style="padding:3px 8px" onclick="this.closest('.doc-block').remove()"><i class="ti ti-trash"></i></button></div><div class="doc-block-fields">
<div><div class="field"><label>Nome (se vuoto, usa il nome del file)</label><input id="bn-${b}"></div></div>
${t==='OTHER'?`<div class="field"><label>Tipo di documento</label>${catIn('bc-'+b)}</div>`:`<div class="field"><label>${TL[t]}</label>${tp(b,t)}</div>`}
<div class="field"><label>File (.pdf, .doc, .docx)</label><input type="file" id="bf-${b}" accept="${t==='OTHER'?ACC+',.jpg,.jpeg,.png':ACC}" onchange="pend['${b}']=this.files[0]"></div></div></div>`}
function addBlk(t){const d=document.createElement('div');d.innerHTML=blk(t);$('blks').appendChild(d.firstElementChild)}
function jobModal(id){const j=state.jobs.find(x=>x.id===id)||{title:'',org:'',location:'',status:'Applied',date:today(),deadline:'',url:'',notes:'',lastContact:'',contactEmail:'',followUpDate:''};eid=id||null;
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal xl"><h2><i class="ti ti-briefcase"></i>${id?'Edit':'New'} application</h2>
<div class="field-row"><div class="field"><label>Job title</label><input id="j-title" value="${esc(j.title)}"></div><div class="field"><label>Organisation</label><input id="j-org" value="${esc(j.org)}"></div></div>
<div class="field-row"><div class="field"><label>Location</label><input id="j-loc" value="${esc(j.location)}"></div><div class="field"><label>Status</label><select id="j-st">${STAT.map(s=>`<option${s===j.status?' selected':''}>${s}</option>`).join('')}</select></div></div>
<div class="field-row"><div class="field"><label>Date applied</label><input type="date" id="j-date" value="${j.date||''}"></div><div class="field"><label>Deadline</label><input type="date" id="j-dl" value="${j.deadline||''}"></div></div>
<div class="field"><label>Job post URL</label><input id="j-url" value="${esc(j.url)}"></div>
<div class="modal-divider"><i class="ti ti-address-book"></i> Contatto recruiter</div>
<div class="field-row"><div class="field"><label>Data ultimo contatto</label><input type="date" id="j-lc" value="${j.lastContact||''}"></div><div class="field"><label>Prossimo follow-up</label><input type="date" id="j-fu" value="${j.followUpDate||''}"></div></div>
<div class="field"><label>Email di contatto</label><input type="email" id="j-em" value="${esc(j.contactEmail)}" placeholder="nome@azienda.com"></div>
<div class="field"><label>Notes</label><textarea id="j-notes" style="min-height:60px">${esc(j.notes)}</textarea></div>
${id?'<div class="modal-divider"><i class="ti ti-files"></i> Allegati di questa application</div><div id="jdocs"></div>':''}<div class="modal-divider"><i class="ti ti-paperclip"></i> Aggiungi nuovi documenti</div>
<div id="blks"></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-cl" onclick="addBlk('CL')"><i class="ti ti-plus"></i> Cover letter</button><button class="btn btn-cv" onclick="addBlk('CV')"><i class="ti ti-plus"></i> CV</button><button class="btn btn-app" onclick="addBlk('APP')"><i class="ti ti-plus"></i> App form</button><button class="btn btn-other" onclick="addBlk('OTHER')"><i class="ti ti-plus"></i> Supporting documents</button></div>
<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sv" onclick="saveJob()">Save</button></div></div></div>`);jd()}
async function saveJob(){const title=$('j-title').value.trim(),org=$('j-org').value.trim();if(!title||!org)return alert('Titolo e organizzazione sono obbligatori');
const old=state.jobs.find(x=>x.id===eid),j=Object.assign({},old,{id:eid||uid(),title,org,location:$('j-loc').value.trim(),status:$('j-st').value,date:$('j-date').value,deadline:$('j-dl').value,url:$('j-url').value.trim(),notes:$('j-notes').value.trim(),lastContact:$('j-lc').value,followUpDate:$('j-fu').value,contactEmail:$('j-em').value.trim()});
if(old)state.jobs[state.jobs.indexOf(old)]=j;else state.jobs.unshift(j);
$('sv').disabled=true;$('sv').textContent='Caricamento...';const errs=[];
for(const el of document.querySelectorAll('.doc-block')){const b=el.dataset.b,t=el.dataset.t;if(t!=='OTHER')tadd(b);const f=pend[b],name=$('bn-'+b).value.trim()||(f&&f.name.replace(/\.[^.]+$/,''));if(!name)continue;
const d={id:uid(),type:t,name,description:'',topics:t==='OTHER'?[]:[...(tops[b]||[])],category:t==='OTHER'?$('bc-'+b).value.trim():undefined,linkedJob:j.id,date:today(),file:null};
if(f)try{d.file=await up(d.id,f)}catch(e){errs.push(name+': '+e.message)}state.docs.unshift(d)}
save();closeModal();render();if(errs.length)alert('Documenti creati ma file non caricati (riprova con "Sostituisci file"):\n'+errs.join('\n'))}
function unlink(id){doc(id).linkedJob='';save();render()}
function jd(){const el=$('jdocs');if(!el)return;const L=state.docs.filter(d=>d.linkedJob===eid);
el.innerHTML=L.length?L.map(d=>`<div class="card" style="padding:.6rem .8rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="ci ${CI[d.type]}" style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-${TI[d.type]}"></i></div>
<div style="flex:1;min-width:140px"><div style="font-size:13px;font-weight:500">${esc(d.name)}</div><div style="font-size:11px;color:var(--text2)">${TN[d.type]}${d.category?' · '+esc(d.category):''}${(d.topics||[]).length?' · '+d.topics.map(esc).join(', '):''}${d.file?' · '+esc(d.file.name)+' ('+fsz(d.file.size)+')':' · nessun file'}</div></div>
${d.file?`<button class="btn" onclick="dl('${d.id}')"><i class="ti ti-download"></i> Scarica</button>`:''}<button class="btn" title="Sostituisce il file ovunque compaia il documento" onclick="pick('${d.id}')"><i class="ti ti-upload"></i> Sostituisci file</button>
<button class="btn" title="Toglie il documento da questa application ma lo tiene in libreria" onclick="unlink('${d.id}')"><i class="ti ti-unlink"></i> Scollega</button>
<button class="btn danger" title="Elimina documento e file" onclick="delDoc('${d.id}')"><i class="ti ti-trash"></i> Elimina</button></div>`).join(''):'<div style="font-size:12px;color:var(--text3)">Nessun allegato.</div>'}
function docModal(t,jobId,id){const d=doc(id)||{type:t,name:'',description:'',topics:[],category:'',linkedJob:jobId||'',date:today(),file:null};eid=id||null;pend.m=null;
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-${TI[t]}" style="color:${TC[t]}"></i>${id?'Edit':'New'} ${TN[t]}</h2>
<div class="field"><label>Nome (se vuoto, usa il nome del file)</label><input id="d-name" value="${esc(d.name)}"></div>
<div class="field"><label>Descrizione (opzionale)</label><input id="d-desc" value="${esc(d.description)}"></div>
${t==='OTHER'?`<div class="field"><label>Tipo di documento</label>${catIn('d-cat',d.category)}</div>`:`<div class="field"><label>${TL[t]}</label>${tp('m',t,d.topics)}</div>`}
<div class="field"><label>Application collegata</label><select id="d-job"><option value="">Nessuna</option>${state.jobs.map(j=>`<option value="${j.id}"${j.id===d.linkedJob?' selected':''}>${esc(j.org)} - ${esc(j.title)}</option>`).join('')}</select></div>
<div class="field"><label>File (.pdf, .doc, .docx${t==='OTHER'?', .jpg, .png':''})${d.file?' - attuale: '+esc(d.file.name)+', scegline uno per sostituirlo':''}</label><input type="file" accept="${t==='OTHER'?ACC+',.jpg,.jpeg,.png':ACC}" onchange="pend.m=this.files[0]"></div>
<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sv" onclick="saveDoc('${t}')">Save</button></div></div></div>`)}
async function saveDoc(t){if(t!=='OTHER')tadd('m');const f=pend.m,name=$('d-name').value.trim()||(f&&f.name.replace(/\.[^.]+$/,''));if(!name)return alert('Inserisci un nome o scegli un file');
const old=doc(eid),d=Object.assign({},old,{id:eid||uid(),type:t,name,description:$('d-desc').value.trim(),linkedJob:$('d-job').value,topics:t==='OTHER'?[]:[...tops.m],file:old?old.file:null,date:old?old.date:today()});
if(t==='OTHER')d.category=$('d-cat').value.trim();
$('sv').disabled=true;$('sv').textContent='Caricamento...';
if(f)try{const nf=await up(d.id,f),prev=d.file;d.file=nf;if(prev)rm(prev.path)}catch(e){$('sv').disabled=false;$('sv').textContent='Save';return alert('Upload non riuscito: '+e.message)}
if(old)state.docs[state.docs.indexOf(old)]=d;else state.docs.unshift(d);save();closeModal();render()}
function cvPicker(jid){const cvs=state.docs.filter(d=>d.type==='CV');
show(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2><i class="ti ti-id" style="color:var(--cv)"></i> CV per questa application</h2>
${cvs.length?`<div style="font-size:12px;color:var(--text2);margin-bottom:8px">Tocca per collegare o scollegare un CV esistente</div><div class="cv-pick-list">${cvs.map(d=>`<div class="cv-pick-item${d.linkedJob===jid?' sel':''}" onclick="linkCv('${d.id}','${jid}')"><div style="flex:1"><b style="font-size:13px">${esc(d.name)}</b><div>${(d.topics||[]).map(t=>`<span class="tag ${tc(t)}">${esc(t)}</span>`).join(' ')}</div></div>${d.linkedJob===jid?'<i class="ti ti-check" style="color:var(--cv)"></i>':''}</div>`).join('')}</div>`:'<p style="font-size:13px;color:var(--text2)">Nessun CV salvato.</p>'}
<div class="modal-actions"><button class="btn" onclick="closeModal()">Chiudi</button><button class="btn btn-cv" onclick="closeModal();docModal('CV','${jid}')"><i class="ti ti-plus"></i> Nuovo CV</button></div></div></div>`)}
function linkCv(id,jid){const d=doc(id);d.linkedJob=d.linkedJob===jid?'':jid;save();render();cvPicker(jid)}
async function delJob(id){if(!confirm('Eliminare questa application? I documenti collegati restano nelle librerie.'))return;state.jobs=state.jobs.filter(x=>x.id!==id);state.docs.forEach(d=>{if(d.linkedJob===id)d.linkedJob=''});save();render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='job-tracker-metadata.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{const p=JSON.parse(x.target.result);state.jobs=p.jobs||[];state.docs=p.docs||[];norm();save();render()}catch(err){alert('File non valido')}};r.readAsText(f)}
load();render();if(key())pull();else{ss('err','Sync non configurato');$('setup').style.display='flex'}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&key()&&!pt)pull()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
